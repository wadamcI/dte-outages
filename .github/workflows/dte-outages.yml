name: Fetch latest outages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/**', 'scripts/**']

permissions:
  contents: write

# Never let two runs race on the same push.
concurrency:
  group: fetch-outages
  cancel-in-progress: false

env:
  CONTACT_EMAIL: wadamc@umich.edu
  REPO_URL: https://github.com/${{ github.repository }}
  # DTE's certificate for outagemap.serv.dteenergy.com expired 2026-09-23,
  # which broke every run. When true, a request that fails *only* certificate
  # verification (curl exit 60) is retried without it and flagged as a warning.
  # This is public, read-only data; set to 'false' once DTE renews the cert.
  ALLOW_INSECURE_TLS_FALLBACK: 'true'

jobs:
  dte:
    name: DTE outages (layer 2, GeoJSON + pagination)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DTE snapshot
        id: fetch
        run: scripts/fetch_dte.sh

      - name: Update outage history
        run: python3 scripts/history.py update

      - name: Commit & push
        run: |
          git config user.name  "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A dte
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if [ ! -f dte-message.txt ]; then
            echo "DTE outage history refresh: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dte-message.txt
          fi
          git commit -F dte-message.txt
          git pull --rebase
          git push
