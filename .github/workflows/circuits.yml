name: Rebuild inferred circuits

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 0'  # weekly, Sunday 07:30 UTC

permissions:
  contents: write

# Shares the fetch workflow's group so the two never push at the same time.
concurrency:
  group: fetch-outages
  cancel-in-progress: false

jobs:
  circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the inference replays every snapshot in git history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Infer circuits
        run: python scripts/circuits.py

      - name: Commit & push
        run: |
          git config user.name  "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add dte/circuits
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Rebuild inferred circuits: $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
